<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="An offline-first football scorekeeper for player stats, fantasy points, and live team scores.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sideline">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Sideline Scorekeeper</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Sideline Scorekeeper home" data-nav="home">
        <span class="brand-mark">S</span>
        <span class="brand-copy"><strong>SIDELINE</strong><small>SCOREKEEPER</small></span>
      </a>
      <div class="topbar-right">
        <span id="connection-status" class="status-pill"><span class="status-dot"></span><span>Checking</span></span>
        <button class="icon-button" id="quick-add-player" type="button" aria-label="Add player" title="Add player">＋</button>
      </div>
    </header>
    <main id="app-main" class="main-content" tabindex="-1">
      <div class="loading-state"><div class="loader"></div><p>Loading your sideline…</p></div>
    </main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-nav="home" type="button"><span class="nav-icon">⌂</span><span>Home</span></button>
      <button class="nav-item" data-nav="game" type="button"><span class="nav-icon">▣</span><span>Game</span></button>
      <button class="nav-item" data-nav="players" type="button"><span class="nav-icon">♙</span><span>Players</span></button>
      <button class="nav-item" data-nav="leaderboard" type="button"><span class="nav-icon">↗</span><span>Leaders</span></button>
      <button class="nav-item" data-nav="more" type="button"><span class="nav-icon">•••</span><span>More</span></button>
    </nav>
  </div>
  <dialog id="app-dialog" class="app-dialog">
    <div class="dialog-panel">
      <div class="dialog-heading">
        <div><p class="eyebrow" id="dialog-eyebrow">SIDELINE</p><h2 id="dialog-title">New action</h2></div>
        <button type="button" class="icon-button close-dialog" aria-label="Close">×</button>
      </div>
      <div id="dialog-content"></div>
    </div>
  </dialog>
  <input id="backup-file-input" type="file" accept="application/json,.json" hidden>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script src="./app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          const el = document.getElementById('connection-status');
          if (el) el.innerHTML = '<span class="status-dot warn"></span><span>Offline setup issue</span>';
        });
      });
    }
  </script>
</body>
</html>
