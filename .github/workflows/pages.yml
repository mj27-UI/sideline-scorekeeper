name: Deploy Sideline Scorekeeper
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          set -e
          unzip -t sideline-scorekeeper-v2.zip
          mkdir -p _site
          unzip -q sideline-scorekeeper-v2.zip
          cat .deploy-patches/update-*.xz.b64 | base64 --decode | xz --decompress > /tmp/sideline-update.patch
          patch --batch --forward -p1 -d sideline-scorekeeper < /tmp/sideline-update.patch
          cp -R sideline-scorekeeper/. _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
